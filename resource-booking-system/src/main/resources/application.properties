spring.application.name=resource-booking-system

# ===================== DATABASE =====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resource_booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / HIBERNATE =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================== JWT =====================
jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret-32bytes}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===================== SWAGGER =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===================== LOGGING =====================
logging.level.com.example.resourcebooking=INFO
logging.level.org.springframework.security=INFO
